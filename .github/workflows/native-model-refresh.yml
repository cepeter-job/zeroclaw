name: Native Model Refresh Contracts

on:
  workflow_dispatch:
  push:
    branches: [feat/native-free-model-refresh]
    paths:
      - 'crates/zeroclaw-config/**'
      - 'crates/zeroclaw-runtime/**'
      - 'crates/zeroclaw-providers/**'
      - '.github/workflows/native-model-refresh.yml'

permissions:
  contents: read

concurrency:
  group: native-model-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - name: Format new contracts and refresher
        run: rustfmt --edition 2024 --check crates/zeroclaw-runtime/src/model_catalog_refresh/mod.rs crates/zeroclaw-runtime/src/model_catalog_refresh/catalog.rs crates/zeroclaw-config/tests/model_catalog_refresh.rs
      - name: Configuration contracts
        run: cargo test --locked -p zeroclaw-config --test model_catalog_refresh
      - name: Refresh and cache contracts
        run: cargo test --locked -p zeroclaw-runtime --lib model_catalog_refresh
      - name: Codex provider and catalog contracts
        run: cargo test --locked -p zeroclaw-providers --lib openai_codex
      - name: Build native CLI
        run: cargo build --locked --bin zeroclaw
      - name: Upload tested native CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zeroclaw-native-model-refresh-linux-x86_64
          path: target/debug/zeroclaw
          if-no-files-found: error
